name: Feature request
description: Suggest an improvement to the factory or an extension.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: input
    id: extension
    attributes:
      label: Extension or factory area
      placeholder: shared, generator, or extension slug
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
