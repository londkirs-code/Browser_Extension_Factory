name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed extensions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect affected extensions
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx tools/changed-extensions.ts

  quality:
    name: Lint, tests, audit, and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Audit dependencies
        run: pnpm audit
      - name: Validate extension sources and secrets
        run: pnpm validate
      - name: Validate workflow YAML
        run: pnpm validate:workflows

  generator-smoke:
    name: Verify pnpm new and dual-browser build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate a fresh extension non-interactively
        run: >
          pnpm new -- --slug ci-generator-smoke
          --name "CI Generator Smoke"
          --description "Automated verification of the pnpm new generator."
          --permissions storage
          --optional-permissions=,
          --host-permissions=,
          --optional-host-permissions=,
          --content-matches=https://example.com/*
          --firefox-data-collection-required=none
          --firefox-data-collection-optional=,
          --popup true
          --options true
          --content-script true
          --background true
      - name: Build generated extension for Chrome and Firefox
        run: pnpm build ci-generator-smoke
      - name: Build all extensions for both browsers
        run: pnpm build:all
      - name: Verify browser ZIP and source ZIP packaging
        run: pnpm zip ci-generator-smoke
      - name: Validate generated extension metadata and permissions
        run: pnpm validate -- ci-generator-smoke

  build:
    name: Build ${{ matrix.extension }} for both browsers
    needs: [changes, quality]
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Chrome/Chromium and Firefox
        run: pnpm build "${{ matrix.extension }}"
      - name: Upload browser build outputs
        uses: actions/upload-artifact@v7
        with:
          name: builds-${{ matrix.extension }}-${{ github.run_id }}
          path: |
            extensions/${{ matrix.extension }}/.output/chrome-mv3/**
            extensions/${{ matrix.extension }}/.output/firefox-mv3/**
          if-no-files-found: error
          retention-days: 14
