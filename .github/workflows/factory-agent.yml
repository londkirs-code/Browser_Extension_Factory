name: Factory Agent

# Runs on branches named factory/**. Lets a model that can only edit files on GitHub
# scaffold extensions, sync the lockfile, format, test and build with no human steps.
# It never runs on main, never publishes to stores, and never creates release tags.
on:
  push:
    branches:
      - "factory/**"

permissions:
  contents: write

concurrency:
  group: factory-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Scaffold, verify and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Discover dependency build scripts
        run: pnpm install --no-frozen-lockfile
        continue-on-error: true
      - name: Approve build scripts for declared direct dependencies
        run: pnpm exec tsx tools/approve-direct-builds.ts
      - name: Install dependencies and sync the lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Run factory pipeline
        run: pnpm exec tsx tools/factory-run.ts
      - name: Upload extension ZIP packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factory-extension-packages
          path: extensions/*/.output/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated files, lockfile, formatting and report to this branch
        if: always()
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore(factory): automated scaffold, lockfile, format and report"
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
