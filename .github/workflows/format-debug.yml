name: Temporary formatter probe

on:
  push:
    branches: [fix/format-debug]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical formatting
        run: |
          pnpm exec prettier --write packages/shared/src/browser.ts packages/shared/src/storage.test.ts
          echo "=== BROWSER ==="
          cat packages/shared/src/browser.ts
          echo "=== STORAGE TEST ==="
          cat packages/shared/src/storage.test.ts
